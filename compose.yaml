# `npm run start` runs this file; `npm run dev` adds compose.dev.yaml.
# The app always runs in this container, so it can only reach the files mounted
# below: the data folder and the read-only templates.
services:
  app:
    build:
      context: .
      target: runner
    env_file: .env
    environment:
      DATA_DIR: /app/data
    # Localhost only: the app has no authentication (constitution Art. III.6).
    ports:
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    # Ollama runs on the host, not in compose (Art. V.2).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./templates:/app/templates:ro
